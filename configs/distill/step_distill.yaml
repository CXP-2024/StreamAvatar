# DyStream AR Rollout-Aware DiffusionHead Step Distillation: 5步 → 1步
# Usage:
#   Smoke test: python train_distill.py --config configs/distill/step_distill.yaml --override data.max_clips=10 training.max_steps=100
#   Full train: python train_distill.py --config configs/distill/step_distill.yaml
#   Verify:     python verify_distill.py --distilled outputs/distill_rollout/distilled_best.pt

seed: 42

# --- Paths ---
checkpoint_path: checkpoints/last.ckpt
wav2vec_path: pretrained_model/wav2vec2-base-960h
output_dir: outputs/distill_rollout
lrs3_root: /mnt/pfs/group-jt/zihan.guo/droid/LRS3/lrs3/trainval/trainval

# --- Model (must match checkpoint) ---
model:
  module_name: model.motion_generation.motion_gen_gpt_flowmatching_addaudio_linear_twowavencoder
  class_name: Audio2FaceGPT
  pose_fps: 25
  audio_sr: 16000
  audio_fps: 16000
  wav2vec_layer: 8
  cbh_window_length: 96
  vae_codebook_size: 512
  seed: 42
  prev_audio_frames: 32
  ema_decay: 0.999
  # CFG (teacher inference)
  cfg_audio: 0.5
  cfg_audio_other: 0.5
  cfg_anchor: 0
  cfg_all: 1.0
  cfg_fusion: 2.0
  cfg_audio_anchor: 1.0
  drop_audio: 0.1
  drop_audio_other: 0.1
  drop_anchor: 0.1
  drop_gpt: 0.1
  drop_style: 0.3
  drop_other: 0.0
  drop_self: 0.0
  drop_fusion: 0.1
  drop_prev_motion: 0.0
  cfg_gpt: 1.0
  cfg_style: 1.0
  cfg_prev_motion: 0.0
  sync_only: true
  use_init_motion: false
  strength: 1.0
  window_size: 8
  total_iter: 600000
  eval_metrics: false
  version: '0506'
  two_step: false
  infer_32: false
  qk_norm: rms_norm_across_heads
  eps: 1.0e-06
  cross_attn_norm: true
  added_kv_proj_dim: null

# --- Teacher ---
teacher:
  denoising_steps: 5
  use_ema: true

# Student timestep is taken from FlowMatchEulerDiscreteScheduler.set_timesteps(1)
# during training so it exactly matches real 1-step inference.

# --- Training ---
training:
  # AR rollout-aware training is much heavier than isolated diffusion-head distillation.
  # Keep batch size small unless you have verified memory headroom.
  batch_size: 8
  num_epochs: 10
  max_steps: 20000
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  log_every: 50
  save_every: 2000
  num_workers: 2
  fp16: true
  train_time_embed: false

# --- Data ---
data:
  max_clips: null
  audio_duration_sec: 3.0
  seq_len: 75
  anchor_std: 0.35

# --- Loss ---
loss:
  velocity_weight: 0.1

# --- Noise Scheduler ---
noise_scheduler:
  num_train_timesteps: 1000
  shift: 1
  use_karras_sigmas: false
